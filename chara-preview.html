<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"><style>body{background:#1b2a4a!important;-webkit-app-region:no-drag}#wrap{width:560px;margin:20px auto}</style></head><body><div id="wrap"><svg id="chara" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe49e"/>
            <stop offset="55%" stop-color="#f7bb6a"/>
            <stop offset="100%" stop-color="#ef9a8a"/>
          </linearGradient>
          <linearGradient id="hairBackG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3c377"/>
            <stop offset="60%" stop-color="#e8a45e"/>
            <stop offset="100%" stop-color="#d98ba0"/>
          </linearGradient>
          <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8fd0ff"/>
            <stop offset="45%" stop-color="#3f7fe8"/>
            <stop offset="100%" stop-color="#1c3f92"/>
          </linearGradient>
          <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffeadd"/>
            <stop offset="100%" stop-color="#ffdcc8"/>
          </linearGradient>
          <linearGradient id="blazerG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b4166"/>
            <stop offset="100%" stop-color="#262b47"/>
          </linearGradient>
          <linearGradient id="tieG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8506a"/>
            <stop offset="100%" stop-color="#a72844"/>
          </linearGradient>
          <linearGradient id="skirtG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a405e"/>
            <stop offset="100%" stop-color="#292e48"/>
          </linearGradient>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
        </defs>

        <!-- ============ BACK HAIR ============ -->
        <g class="backhair">
          <path d="M150,42 C116,44 100,70 101,100 C102,132 95,170 105,206
                   Q112,193 115,180 Q121,199 129,211 Q133,196 134,184
                   Q141,200 150,206 Q159,200 166,184 Q167,196 171,211
                   Q179,199 185,180 Q188,193 195,206
                   C205,170 198,132 199,100 C200,70 184,44 150,42 Z"
                fill="url(#hairBackG)" stroke="#c9803e" stroke-width="1.2"/>
        </g>

        <!-- ============ LEGS (dangle over panel edge) ============ -->
        <g class="leg leg-l">
          <path d="M126,234 C125,242 125,250 126,258 L141,258 C142,250 142,242 141,234 Z" fill="url(#skinG)"/>
          <path d="M126,234 L141,234 L141,240 L126,240 Z" fill="#caa08b" opacity="0.35"/>
          <path d="M125,255 C124,274 125,294 128,314 L139,314 C141,294 142,274 141,255 Z"
                fill="#2a2737" stroke="#1d1b28" stroke-width="1"/>
          <path d="M126,257 L140.5,257" stroke="#4a4560" stroke-width="2.4" opacity="0.9"/>
          <path d="M130,262 C129,278 129,294 131,308" stroke="#57506e" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M127,311 C124,318 124,326 128,331 L140,331 C144,326 143,318 140,312 Z"
                fill="#5a3b2e" stroke="#3d281e" stroke-width="1"/>
          <path d="M126,328 L142,328" stroke="#3d281e" stroke-width="2"/>
        </g>
        <g class="leg leg-r">
          <path d="M159,234 C158,242 158,250 159,258 L174,258 C175,250 175,242 174,234 Z" fill="url(#skinG)"/>
          <path d="M159,234 L174,234 L174,240 L159,240 Z" fill="#caa08b" opacity="0.35"/>
          <path d="M159,255 C158,274 159,294 161,314 L172,314 C175,294 176,274 175,255 Z"
                fill="#2a2737" stroke="#1d1b28" stroke-width="1"/>
          <path d="M159.5,257 L174,257" stroke="#4a4560" stroke-width="2.4" opacity="0.9"/>
          <path d="M164,262 C163,278 163,294 165,308" stroke="#57506e" stroke-width="1.5" fill="none" opacity="0.5"/>
          <path d="M160,311 C157,318 157,326 161,331 L173,331 C177,326 176,318 173,312 Z"
                fill="#5a3b2e" stroke="#3d281e" stroke-width="1"/>
          <path d="M159,328 L175,328" stroke="#3d281e" stroke-width="2"/>
        </g>

        <!-- ============ TORSO ============ -->
        <g class="torso">
          <!-- neck -->
          <path d="M143,134 L143,152 Q150,157 157,152 L157,134 Q150,142 143,134 Z" fill="url(#skinG)"/>
          <path d="M143,134 Q150,142 157,134 L157,141 Q150,147 143,141 Z" fill="#caa08b" opacity="0.4"/>
          <!-- shirt -->
          <path d="M140,150 L160,150 L162,212 L138,212 Z" fill="#f4f2f7" stroke="#d8d4e4" stroke-width="1"/>
          <!-- collar -->
          <path d="M138,148 L150,164 L162,148 L167,156 L150,178 L133,156 Z" fill="#ffffff" stroke="#cfcadd" stroke-width="1"/>
          <!-- tie -->
          <path d="M146,159 L154,159 L156,166 L150,171 L144,166 Z" fill="url(#tieG)" stroke="#8c1f36" stroke-width="0.8"/>
          <path d="M147,169 L153,169 L156,192 L150,199 L144,192 Z" fill="url(#tieG)" stroke="#8c1f36" stroke-width="0.8"/>
          <!-- blazer halves -->
          <path d="M128,152 C120,176 121,196 125,214 L143,214 L141,150 C136,150 131,150 128,152 Z"
                fill="url(#blazerG)" stroke="#1b1f36" stroke-width="1.2"/>
          <path d="M172,152 C180,176 179,196 175,214 L157,214 L159,150 C164,150 169,150 172,152 Z"
                fill="url(#blazerG)" stroke="#1b1f36" stroke-width="1.2"/>
          <!-- lapels -->
          <path d="M141,150 L149,163 L143,167 L139,155 Z" fill="#2e3454" stroke="#1b1f36" stroke-width="0.8"/>
          <path d="M159,150 L151,163 L157,167 L161,155 Z" fill="#2e3454" stroke="#1b1f36" stroke-width="0.8"/>
        </g>


        <!-- ============ SKIRT (sits on the edge) ============ -->
        <g class="skirt">
          <path d="M124,206 L176,206 C182,220 187,232 189,242 Q150,254 111,242 C113,232 118,220 124,206 Z"
                fill="url(#skirtG)" stroke="#1c2038" stroke-width="1.2"/>
          <path d="M131,208 L124,240" stroke="#1c2038" stroke-width="1" opacity="0.7"/>
          <path d="M143,209 L140,245" stroke="#1c2038" stroke-width="1" opacity="0.7"/>
          <path d="M157,209 L160,245" stroke="#1c2038" stroke-width="1" opacity="0.7"/>
          <path d="M169,208 L176,240" stroke="#1c2038" stroke-width="1" opacity="0.7"/>
          <path d="M111,242 Q150,254 189,242 Q150,250 111,242 Z" fill="#161a2e" opacity="0.8"/>
        </g>

        <!-- ============ ARMS (hands resting on edge) ============ -->
        <g class="arm arm-l">
          <path d="M131,152 C121,166 118,190 121,208 L123,222 C124,229 134,229 133,222 L133,204 C132,188 131,168 133,154 Z"
                fill="url(#blazerG)" stroke="#1b1f36" stroke-width="1.1"/>
          <path d="M121,216 L133,216 L133,221 L122,221 Z" fill="#454b70"/>
          <ellipse cx="127.5" cy="228" rx="6.5" ry="5.5" fill="url(#skinG)" stroke="#dba58a" stroke-width="0.8"/>
        </g>
        <g class="arm arm-r">
          <path d="M169,152 C179,166 182,190 179,208 L177,222 C176,229 166,229 167,222 L167,204 C168,188 169,168 167,154 Z"
                fill="url(#blazerG)" stroke="#1b1f36" stroke-width="1.1"/>
          <path d="M179,216 L167,216 L167,221 L178,221 Z" fill="#454b70"/>
          <ellipse cx="172.5" cy="228" rx="6.5" ry="5.5" fill="url(#skinG)" stroke="#dba58a" stroke-width="0.8"/>
        </g>

        <!-- ============ HEAD ============ -->
        <g class="head">
          <!-- face -->
          <path d="M118,90 C117,110 123,126 136,136 Q150,146 164,136 C177,126 183,110 182,90
                   C182,64 166,52 150,52 C134,52 118,64 118,90 Z"
                fill="url(#skinG)" stroke="#e3b096" stroke-width="1"/>
          <!-- under-bangs shadow -->
          <path d="M119,92 Q150,104 181,92 Q150,112 119,92 Z" fill="#d99e80" opacity="0.28" filter="url(#soft)"/>

          <!-- eyes -->
          <g class="eye eye-l">
            <path d="M125,106 Q134,100 144,105 L143,119 Q134,124 126,118 Z" fill="#fff"/>
            <ellipse cx="134.5" cy="112" rx="6.5" ry="8.5" fill="url(#irisG)"/>
            <ellipse cx="134.5" cy="112.5" rx="2.6" ry="3.6" fill="#131c38"/>
            <ellipse cx="134.5" cy="116.5" rx="4" ry="2.4" fill="#9fd8ff" opacity="0.55"/>
            <circle cx="131.5" cy="107.5" r="2.7" fill="#fff"/>
            <circle cx="137.8" cy="115.5" r="1.3" fill="#fff" opacity="0.9"/>
            <path d="M124,104 Q134,96.5 145,103" stroke="#2f2438" stroke-width="3.2" fill="none" stroke-linecap="round"/>
            <path d="M124,104.5 L121,101" stroke="#2f2438" stroke-width="2" stroke-linecap="round"/>
            <path d="M127,120 Q134,123 142,120" stroke="#4a3350" stroke-width="1.2" fill="none" opacity="0.55" stroke-linecap="round"/>
            <path d="M126,99 Q134,94.5 143,98" stroke="#d99b80" stroke-width="1" fill="none" opacity="0.6"/>
          </g>
          <g class="eye eye-r">
            <path d="M156,105 Q166,100 175,106 L174,118 Q166,124 157,119 Z" fill="#fff"/>
            <ellipse cx="165.5" cy="112" rx="6.5" ry="8.5" fill="url(#irisG)"/>
            <ellipse cx="165.5" cy="112.5" rx="2.6" ry="3.6" fill="#131c38"/>
            <ellipse cx="165.5" cy="116.5" rx="4" ry="2.4" fill="#9fd8ff" opacity="0.55"/>
            <circle cx="162.5" cy="107.5" r="2.7" fill="#fff"/>
            <circle cx="168.8" cy="115.5" r="1.3" fill="#fff" opacity="0.9"/>
            <path d="M155,103 Q166,96.5 176,104" stroke="#2f2438" stroke-width="3.2" fill="none" stroke-linecap="round"/>
            <path d="M176,104.5 L179,101" stroke="#2f2438" stroke-width="2" stroke-linecap="round"/>
            <path d="M158,120 Q166,123 173,120" stroke="#4a3350" stroke-width="1.2" fill="none" opacity="0.55" stroke-linecap="round"/>
            <path d="M157,98 Q166,94.5 174,99" stroke="#d99b80" stroke-width="1" fill="none" opacity="0.6"/>
          </g>

          <!-- brows -->
          <path d="M126,94 Q135,89 144,93" stroke="#c98a3f" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M156,93 Q165,89 174,94" stroke="#c98a3f" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- blush -->
          <ellipse cx="127" cy="124" rx="6.5" ry="3.6" fill="#ff9eb0" opacity="0.45" filter="url(#soft)"/>
          <ellipse cx="173" cy="124" rx="6.5" ry="3.6" fill="#ff9eb0" opacity="0.45" filter="url(#soft)"/>

          <!-- nose + mouth -->
          <path d="M151,122.5 L152,125" stroke="#e0a184" stroke-width="1.2" stroke-linecap="round"/>
          <path class="mouth mouth-happy" d="M144,130 Q150,135.5 156,130" stroke="#c25a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="mouth mouth-worried" d="M144,133 Q150,128.5 156,133" stroke="#c25a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path class="sweat" d="M186,100 C190,107 190,112 186,113 C182,112 182,107 186,100 Z" fill="#9fd8ff" stroke="#6db6e8" stroke-width="0.8"/>

          <!-- side locks -->
          <g class="sidelock">
            <path d="M112,86 C105,110 107,134 114,154 C120,147 122,136 121,124 C124,133 128,139 131,135 C126,120 121,102 120,90 Z"
                  fill="url(#hairG)" stroke="#c9803e" stroke-width="1"/>
          </g>
          <g class="sidelock sidelock-r">
            <path d="M188,86 C195,110 193,134 186,154 C180,147 178,136 179,124 C176,133 172,139 169,135 C174,120 179,102 180,90 Z"
                  fill="url(#hairG)" stroke="#c9803e" stroke-width="1"/>
          </g>

          <!-- bangs -->
          <path d="M112,96 C110,66 128,50 150,50 C172,50 190,66 188,96
                   Q184,85 178,83 Q179,96 173,103 Q167,88 161,85 Q162,99 154,105
                   Q150,92 145,104 Q140,98 140,86 Q131,90 128,103 Q122,96 122,84 Q116,86 112,96 Z"
                fill="url(#hairG)" stroke="#c9803e" stroke-width="1.2"/>
          <path d="M119,74 Q150,57 181,74" stroke="#fff" stroke-width="4" opacity="0.35" fill="none" stroke-linecap="round"/>

          <!-- ahoge -->
          <g class="ahoge">
            <path d="M149,52 C143,36 154,25 164,30 C155,31 150,38 153,51 Z" fill="url(#hairG)" stroke="#c9803e" stroke-width="1"/>
          </g>

          <!-- ribbon -->
          <g class="ribbon">
            <path d="M118,84 L105,77 L109,90 Z" fill="#e64c6a" stroke="#b23049" stroke-width="0.8"/>
            <path d="M118,84 L108,95 L103,84 Z" fill="#e64c6a" stroke="#b23049" stroke-width="0.8"/>
            <circle cx="118" cy="84" r="2.8" fill="#ff7d92" stroke="#b23049" stroke-width="0.8"/>
          </g>
        </g>
      </svg></div></body></html>
